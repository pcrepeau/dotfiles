[env]
TERM = "xterm-256color"

[font]
#size = 12

[font.normal]
family = "JetBrains Mono"

[window]
opacity=0.9

[colors]
transparent_background_colors = false

[colors.primary]
background = "#1b2d40"
foreground = "#d6e2ee"

[colors.normal]
black   = "#1b2d40"
red     = "#4d86b0"
green   = "#5e95bc"
yellow  = "#6fa4c9"
blue    = "#6fb8e3"
magenta = "#8bc9eb"
cyan    = "#b4e4f6"
white   = "#d6e2ee"

[colors.bright]
black   = "#4A6B80"
red     = "#73a6cb"
green   = "#86b7d8"
yellow  = "#9dcae5"
blue    = "#f2fcff"
magenta = "#b1d8ee"
cyan    = "#d1eef8"
white   = "#ffffff"

[colors.cursor]
text   = "#071018"
cursor = "#f2fcff"

[terminal]

[terminal.shell]
program = "tmux"